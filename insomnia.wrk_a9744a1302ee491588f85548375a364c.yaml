            name: Get Reservation
            meta:
              id: req_f84b927cd9504a6ebe200b0d6b0d2d77
              created: 1737582534135
              modified: 1740517121252
              isPrivate: false
              description: ""
              sortKey: -1737582532935
            method: GET
            headers:
              - name: Content-Type
                value: application/json
              - name: Authorization
                value: Test
              - name: Copa-Channel-ID
                value: WEBIBE
              - name: Language
                value: en-US
              - name: X-Point-Of-Sale
                value: GS
              - name: X-Currency
                value: USD
              - name: X-OCS-Cache-Control
                value: noCache
              - name: Ocp-Apim-Subscription-Key
                value: "{{_['env-apim-subscription']}}"
            scripts:
              afterResponse: >-
                var responseBody = {};

                var schema = {};



                // Validate Schema

                schema = insomnia.globals.get("g-schema-reservation");   


                insomnia.test('Schema Validation', function() {

                    var result=tv4.validateResult(responseBody, schema, false, true);
                 
                    if(!result.valid){
                        console.log(result);
                    }

                    insomnia.expect(result.valid).to.be.true;
                });



                var jsonData = insomnia.response.json();

                var counter =
                insomnia.globals.get("g-displayres-timeoutcounter");

                var maxTimeOut =
                parseInt(insomnia.globals.get("g-displayres-timeoutmax"));

                var ticketsBodyExists = false, documentsBodyExists = false;


                if(insomnia.globals.get("g-purchasedflight") == true)

                {
                    if(jsonData.Tickets == undefined || jsonData.Tickets.Tickets == undefined)
                    {
                        if(counter < maxTimeOut)
                        {
                            counter++
                            insomnia.globals.set("g-displayres-timeoutcounter", counter);
                            postman.setNextRequest(insomnia.info.requestId);
                        }
                        else{
                            insomnia.test("Tickets timed out", function(){
                                insomnia.expect(counter).to.be.below(maxTimeOut);
                            })
                        }
                    }
                    else ticketsBodyExists = true;
                }

                if(ticketsBodyExists == true)

                {
                    insomnia.test("Tickets Returned: " + jsonData.Confirmations[0].ConfirmationId, function(){
                        insomnia.expect(jsonData.Tickets.Tickets[0].Number).to.be.a("string");
                    })

                    insomnia.globals.set("g-pnrdata", JSON.stringify(jsonData));
                }

                if(insomnia.globals.get("g-purchasedseats") == true)

                {
                    if(jsonData.ValueDocuments == undefined || jsonData.ValueDocuments.ValueDocuments == undefined)
                    {
                        if(counter < maxTimeOut)
                        {
                            counter++
                            insomnia.globals.set("g-displayres-timeoutcounter", counter);
                            postman.setNextRequest(insomnia.info.requestId);
                        }
                        else{
                            insomnia.test("Tickets timed out", function(){
                                insomnia.expect(counter).to.be.below(maxTimeOut);
                            })
                        }
                    }
                    else documentsBodyExists = true;
                }


                if(ticketsBodyExists == true)

                {
                    insomnia.test("Tickets Returned: " + jsonData.Confirmations[0].ConfirmationId, function(){
                        insomnia.expect(jsonData.Tickets.Tickets[0].Number).to.be.a("string");
                    })
                }


                if(documentsBodyExists == true)

                {
                     insomnia.test("Value Documents Returned: " + jsonData.Confirmations[0].ConfirmationId, function(){
                        insomnia.expect(jsonData.ValueDocuments.ValueDocuments[0].Person.FirstName).to.be.a("string");
                    }) 

                    insomnia.globals.set("g-accountnumber", jsonData.ValueDocuments.ValueDocuments[0].Document.Number);
                }
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
