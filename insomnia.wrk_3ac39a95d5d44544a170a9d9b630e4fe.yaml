                  <ns1:XXTransaction>
                     <REQ>
                        <PNRRetrieveRQ TransactionIdentifier="010210201020021020" ApplicationID="WEBEXC">
                           <RecordLocator Source="CMD">BRT4IP</RecordLocator>
                        </PNRRetrieveRQ>
                     </REQ>
                  </ns1:XXTransaction>
               </SOAP-ENV:Body>
            </SOAP-ENV:Envelope>
        headers:
          - name: ocp-Apim-Subscription-Key
            value: 0ba33b0c43eb45769074101c3bcb7e80
          - name: Content-Type
            value: application/xml
        scripts:
          preRequest: >
            // Inicializa variables de performance sólo en la primera iteración

            if (insomnia.info && insomnia.info.iteration === 0) {
                insomnia.environment.set("times", JSON.stringify([]));      // arreglo con todos los tiempos (ms)
                insomnia.environment.set("times_sum", "0");                 // suma acumulada
                insomnia.environment.set("times_min", "");                  // min
                insomnia.environment.set("times_max", "");                  // max
                insomnia.environment.set("times_count", "0");               // conteo
                insomnia.environment.set("avg_response_time", "0");         // promedio actualizado
                insomnia.environment.set("median_response_time", "0");
                insomnia.environment.set("p90_response_time", "0");
                insomnia.environment.set("p95_response_time", "0");
                console.log("Variables de performance inicializadas para la corrida.");
            }
          afterResponse: >
            // Tiempo de respuesta en ms

            let insomnia.response.responseTime = insomnia.response.responseTime;


            // Cargar arreglo actual de tiempos

            let times = [];

            try {
                times = JSON.parse(insomnia.environment.get("times") || "[]");
            } catch (e) {
                times = [];
            }


            // Agregar el tiempo actual

            times.push(insomnia.response.responseTime);

            insomnia.environment.set("times", JSON.stringify(times));


            // Actualizar suma, min, max

            let sum = Number(insomnia.environment.get("times_sum") || 0) +
            insomnia.response.responseTime;

            insomnia.environment.set("times_sum", String(sum));


            let min = insomnia.environment.get("times_min") ?
            Number(insomnia.environment.get("times_min")) :
            insomnia.response.responseTime;

            let max = insomnia.environment.get("times_max") ?
            Number(insomnia.environment.get("times_max")) :
            insomnia.response.responseTime;

            if (insomnia.response.responseTime < min) min =
            insomnia.response.responseTime;

            if (insomnia.response.responseTime > max) max =
            insomnia.response.responseTime;

            insomnia.environment.set("times_min", String(min));

            insomnia.environment.set("times_max", String(max));


            // Conteo

            let count = times.length;

            insomnia.environment.set("times_count", String(count));


            // Promedio

            let avg = sum / count;


            // Mediana

            let sorted = times.slice().sort((a,b) => a - b);

            let median = 0;

            if (sorted.length % 2 === 1) {
              median = sorted[(sorted.length-1)/2];
            } else {
              median = (sorted[sorted.length/2 - 1] + sorted[sorted.length/2]) / 2;
            }


            // Percentiles (p90, p95) - método simple (ceil index)

            function percentile(sortedArr, p) {
              if (!sortedArr.length) return 0;
              let idx = Math.ceil((p/100) * sortedArr.length) - 1;
              idx = Math.min(Math.max(idx, 0), sortedArr.length - 1);
              return sortedArr[idx];
            }

            let p90 = percentile(sorted, 90);

            let p95 = percentile(sorted, 95);


            // Guardar métricas en environment (últimos valores)

            insomnia.environment.set("avg_response_time", String(Math.round(avg
            * 100) / 100));

            insomnia.environment.set("median_response_time",
            String(Math.round(median * 100) / 100));

            insomnia.environment.set("p90_response_time", String(p90));

            insomnia.environment.set("p95_response_time", String(p95));


            // Log para la consola de Postman

            console.log(`Resp: ${insomnia.response.responseTime} ms | Count:
            ${count} | Avg: ${Math.round(avg*100)/100} ms | Min: ${min} ms |
            Max: ${max} ms | p90: ${p90} ms | p95: ${p95} ms`);
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
